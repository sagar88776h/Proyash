# Supabase CLI configuration (https://supabase.com/docs/guides/local-development/cli/config).
# Used by `supabase start` (Docker) and as the reference for hosted project
# settings described in docs/SUPABASE_SETUP.md.
project_id = "prayash"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://localhost:5173/**", "http://127.0.0.1:4173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Staff accounts are invite-only. Never enable public sign-up.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_expiry = 3600

[auth.email.template.invite]
subject = "You have been invited to PRAYASH"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your PRAYASH password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

[auth.sms]
enable_signup = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Both functions authenticate callers themselves (public-api has its own
# abuse protection; staff-api verifies the user's JWT and roles).
[functions.public-api]
verify_jwt = false

[functions.staff-api]
verify_jwt = false
